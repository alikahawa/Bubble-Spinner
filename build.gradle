plugins {
    id 'java'
//    id 'eclipse' // optional (to generate Eclipse project files)
//    id 'idea' // optional (to generate IntelliJ IDEA project files)
    id 'application'

    // Test coverage
    id 'jacoco'

    // Code style
    id 'checkstyle'

    // PMD
    id 'pmd'

    // FindBugs / SpotBugs (temporarily disabled for initial build)
    // id "com.github.spotbugs" version "6.0.7"

    // OpenFX
    id 'org.openjfx.javafxplugin' version '0.1.0'


}

group 'nl.tudelft.cse.sem.template'
version '1.0-SNAPSHOT'

sourceCompatibility = 21
targetCompatibility = 21

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
    ignoreFailures = true

    jacoco {
        enabled = true
        includes = ['*']
        excludes = ['gui/**',
                    'auth/Serialize.java']
        //serialize is excluded because the class is not currently in use.
    }
}

dependencies {
    implementation group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '3.3.2'
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.1')
    testImplementation 'org.mockito:mockito-core:5.7.0'
    // spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.7.1' // temporarily disabled
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            enabled = true
            element = 'CLASS'
            excludes = ['main/gui/**']
            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                maximum = 400
            }
        }
    }
}

checkstyle {
    toolVersion "8.25"
    maxWarnings = 0
    ignoreFailures = true
	configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

pmd {
    incrementalAnalysis = true
    ignoreFailures = true
}

// SpotBugs configuration temporarily disabled for initial build
// spotbugs {
//     ignoreFailures = false
//     effort = com.github.spotbugs.snom.Effort.DEFAULT
//     reportLevel = com.github.spotbugs.snom.Confidence.HIGH
//     excludeFilter = file("$rootProject.projectDir/config/spotbugs/excludeFilter.xml")
// }

javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}
application {
    mainClass = 'gui.Main'
}

// SpotBugs task configuration temporarily disabled
// tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
//     reports {
//         xml.required = false
//         html.required = true
//     }
// }

wrapper {
    distributionType = Wrapper.DistributionType.ALL
}
