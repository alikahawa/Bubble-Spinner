# Bubble-Spinner Professional Edition Configuration
# Version 2.0 - Modern Configuration Settings
# Author: Ali Kahawati (Modernization - 2025)

# ==================================================
# APPLICATION SETTINGS
# ==================================================
app.name=Bubble Spinner
app.version=2.0
app.edition=Professional Edition
app.author=Team SEM-13, Ali Kahawati (Modernization)

# ==================================================
# WINDOW SETTINGS
# ==================================================
window.title=Bubble Spinner - Professional Edition v2.0
window.width=800
window.height=600
window.min_width=800
window.min_height=600
window.resizable=true
window.maximized=false

# ==================================================
# THEME SETTINGS
# ==================================================
theme.default=modern
theme.css_path=/styles/modern-theme.css
theme.enable_animations=true
theme.enable_transitions=true
theme.accessibility_mode=false

# ==================================================
# GAME SETTINGS
# ==================================================
game.default_difficulty=normal
game.enable_sound=true
game.enable_music=true
game.sound_volume=0.7
game.music_volume=0.5
game.auto_save=true
game.save_interval=30000

# Level configuration
game.levels.easy_start=0
game.levels.normal_start=3
game.levels.hard_start=6
game.levels.max_level=9

# Physics settings
game.physics.bubble_speed=5.0
game.physics.grid_rotation_speed=0.02
game.physics.max_bounces=3

# ==================================================
# UI SETTINGS
# ==================================================
ui.animations.duration=300
ui.transitions.fade_duration=250
ui.button.hover_effect=true
ui.show_tooltips=true
ui.confirm_exit=true

# ==================================================
# DATABASE SETTINGS
# ==================================================
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://localhost:3306/bubble_spinner
db.username=bubble_user
db.password=bubble_pass
db.connection_timeout=5000
db.max_connections=10
db.auto_reconnect=true

# Connection pool settings
db.pool.initial_size=2
db.pool.max_size=10
db.pool.min_idle=1
db.pool.max_idle=5

# ==================================================
# LOGGING SETTINGS
# ==================================================
logging.level=INFO
logging.console.enabled=true
logging.file.enabled=true
logging.file.path=logs/bubble-spinner.log
logging.file.max_size=10MB
logging.file.max_files=5

# Component-specific logging levels
logging.level.game=DEBUG
logging.level.ui=INFO
logging.level.db=WARN
logging.level.audio=INFO

# ==================================================
# PERFORMANCE SETTINGS
# ==================================================
performance.fps_target=60
performance.vsync=true
performance.multi_threading=true
performance.memory.gc_threshold=0.8
performance.texture.cache_size=50MB

# ==================================================
# DEVELOPMENT SETTINGS
# ==================================================
dev.debug_mode=false
dev.show_fps=false
dev.enable_console=false
dev.mock_database=false
dev.skip_intro=false

# ==================================================
# SECURITY SETTINGS
# ==================================================
security.password.min_length=6
security.session.timeout=1800000
security.encryption.enabled=true
security.auto_logout=false

# ==================================================
# LOCALIZATION SETTINGS
# ==================================================
locale.default=en_US
locale.supported=en_US,es_ES,fr_FR,de_DE
locale.date_format=yyyy-MM-dd
locale.time_format=HH:mm:ss

# ==================================================
# AUDIO SETTINGS
# ==================================================
audio.format=wav
audio.sample_rate=44100
audio.buffer_size=1024
audio.enable_3d=false

# Sound file paths
audio.sounds.shot=/sounds/shot.wav
audio.sounds.pop=/sounds/pop.wav
audio.sounds.win=/sounds/win.wav
audio.sounds.lose=/sounds/lose.wav
audio.music.background=/sounds/background.wav
audio.music.menu=/sounds/menu.wav

# ==================================================
# ANALYTICS SETTINGS (Future Use)
# ==================================================
analytics.enabled=false
analytics.anonymous=true
analytics.endpoint=https://analytics.bubble-spinner.com/api/v1
analytics.session_tracking=true

# ==================================================
# UPDATE SETTINGS (Future Use)
# ==================================================
updates.check_enabled=true
updates.auto_update=false
updates.check_interval=86400000
updates.channel=stable
updates.endpoint=https://updates.bubble-spinner.com/api/v1

# ==================================================
# FEATURE FLAGS
# ==================================================
features.multiplayer=false
features.achievements=false
features.cloud_save=false
features.custom_themes=true
features.level_editor=false
features.replay_system=false
