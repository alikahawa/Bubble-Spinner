# Bubble-Spinner Professional Edition Logging Configuration
# Version 2.0 - Modern Logging Settings
# Author: Ali Kahawati (Modernization - 2025)

# ==================================================
# ROOT LOGGER CONFIGURATION
# ==================================================
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler

# Root logger level
.level=INFO

# ==================================================
# CONSOLE HANDLER CONFIGURATION
# ==================================================
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Console output format
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %2$s: %5$s %6$s%n

# ==================================================
# FILE HANDLER CONFIGURATION
# ==================================================
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.pattern=logs/bubble-spinner-%u.log
java.util.logging.FileHandler.limit=10485760
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# ==================================================
# PACKAGE-SPECIFIC LOGGING LEVELS
# ==================================================

# Main application
gui.Main.level=INFO
gui.SceneLoader.level=INFO

# Game logic
game.level=INFO
game.Game.level=DEBUG
game.ScoreCalculator.level=INFO

# UI Controllers
gui.GameController.level=INFO
gui.MainScreenController.level=INFO
gui.StartController.level=INFO
gui.ScoreboardController.level=INFO

# Grid and collision system
grid.level=INFO
grid.Grid.level=DEBUG
grid.Collision.level=DEBUG

# Authentication and database
auth.level=INFO
auth.DatabaseConnection.level=WARN

# Bubble physics
grid.bubble.level=INFO

# ==================================================
# PERFORMANCE MONITORING
# ==================================================
performance.level=INFO
memory.level=INFO
threading.level=WARN

# ==================================================
# DEVELOPMENT LOGGING
# ==================================================
# Set to FINEST for detailed debugging
dev.debug.level=INFO

# SQL logging (for database debugging)
sql.level=WARNING

# ==================================================
# ERROR HANDLING
# ==================================================
error.level=SEVERE
exception.level=SEVERE
